name: "Test module on QEMU"

run-name: "Input matrix on ${{ github.ref_name }}"

on:
  workflow_dispatch:

jobs:
  module:
    uses: NethServer/ns8-github-actions/.github/workflows/module-info.yml@v1

  # Exercises: distro=debian12, runs_on, vm_cpus, disk_size, timeout_minutes
  knobs:
    needs: module
    uses: stephdl/ns8-ci-actions/.github/workflows/test-on-qemu.yml@drop-dockerhub
    with:
      distro: debian12
      runs_on: ubuntu-22.04
      vm_cpus: 2
      vm_mem: 4096
      disk_size: 20G
      timeout_minutes: 30
      image_url: ${{ needs.module.outputs.image }}
      repo_ref: ${{ needs.module.outputs.sha }}
      version_tag: knobs

  # Exercises: cloud_image_url, corebranch, install_args, script, path
  paths:
    needs: module
    uses: stephdl/ns8-ci-actions/.github/workflows/test-on-qemu.yml@drop-dockerhub
    with:
      distro: rocky9
      cloud_image_url: "https://dl.rockylinux.org/pub/rocky/9/images/x86_64/Rocky-9-GenericCloud-Base.latest.x86_64.qcow2"
      corebranch: 3.22.0-dev.6
      install_args: ghcr.io/nethserver/core:3.22.0-dev.6
      script: run-tests.sh
      path: subdir
      image_url: ${{ needs.module.outputs.image }}
      repo_ref: ${{ needs.module.outputs.sha }}
      version_tag: paths
