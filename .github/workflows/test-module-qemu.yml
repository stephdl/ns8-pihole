name: "Test module on QEMU"

# run-name is evaluated before any job, so it cannot read module-info's outputs
# and rebuilds the image reference from the event instead. main maps to latest
# there, the same way module-info maps it.
run-name: "ghcr.io/${{ github.repository_owner }}/pihole:${{ github.event.workflow_run.head_branch == 'main' && 'latest' || github.event.workflow_run.head_branch || github.ref_name }}"

# Replaces the DigitalOcean pipeline, which needed the Nethesis account. The job
# lives in stephdl/ns8-ci-actions.

on:
  workflow_run:
    workflows: ["Publish images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      debug_shell:
        description: "Open a tmate shell when the suite fails"
        required: false
        default: false
        type: boolean
      ui_tests:
        description: "Run the cases tagged ui and publish their screenshots"
        required: false
        default: false
        type: boolean

# github.ref is the default branch under workflow_run, so it cannot key this.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  module:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: NethServer/ns8-github-actions/.github/workflows/module-info.yml@main

  # The cases tagged ui drive a browser and publish their screenshots on the
  # pull request. Worth it when the interface itself moved, which is what a
  # renovate bump of a ui/ dependency does; noise on every other push.
  ui_tests:
    needs: module
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.module.outputs.sha }}
          fetch-depth: 2
      - id: decide
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          FORCED: ${{ github.event.inputs.ui_tests == 'true' }}
        run: |
          set -euo pipefail
          if git diff --name-only HEAD^ HEAD | grep -qE '^ui/|^build-images.sh$'; then
            touched_ui=true
          else
            touched_ui=false
          fi
          case "${BRANCH}" in
            renovate-*|renovate/*) renovate=true ;;
            *) renovate=false ;;
          esac
          if [ "${FORCED}" = "true" ] || { [ "${touched_ui}" = "true" ] && [ "${renovate}" = "true" ]; }; then
            needed=true
          else
            needed=false
          fi
          echo "branch=${BRANCH} touched_ui=${touched_ui} renovate=${renovate} needed=${needed}"
          echo "needed=${needed}" >> "$GITHUB_OUTPUT"

  test:
    needs: [module, ui_tests]
    # The screenshots are published as a comment, and a called workflow cannot
    # hold more than its caller
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky9, debian13]
    uses: stephdl/ns8-ci-actions/.github/workflows/test-on-qemu.yml@v1
    with:
      distro: ${{ matrix.distro }}
      image_url: ${{ needs.module.outputs.image }}
      repo_ref: ${{ needs.module.outputs.sha }}
      version_tag: ${{ needs.module.outputs.tag }}
      # Empty: run the shared runner of ns8-ci-actions rather than a copy here
      script: ""
      # One leg only: each one that carries the flag comments on the pull request
      run_ui_tests: ${{ matrix.distro == 'rocky9' && needs.ui_tests.outputs.needed == 'true' }}
      # Guest RAM in MiB, 8192 by default. The runner has 15360 and needs some
      # for itself, so 12288 is the practical ceiling.
      # vm_mem: 12288
      debug_shell: ${{ github.event.inputs.debug_shell == 'true' || false }}
