name: "Test module on QEMU"

# Self-contained alternative to test-module.yml, which needs the Nethesis
# DigitalOcean infrastructure. Same chaining as that workflow: it waits for
# "Publish images" to succeed and tests the image it published, so a broken
# build never spends twenty runner minutes proving it is broken.
#
# The job itself lives in stephdl/ns8-ci-actions.

on:
  workflow_run:
    workflows: ["Publish images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      debug_shell:
        description: "Open a tmate shell when the suite fails"
        required: false
        default: false
        type: boolean

# github.ref is the default branch under workflow_run, so keying the group on it
# would put every branch in one group and have them cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  module:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: NethServer/ns8-github-actions/.github/workflows/module-info.yml@main

  test:
    needs: module
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky9, debian13]
    uses: stephdl/ns8-ci-actions/.github/workflows/test-on-qemu.yml@v1
    with:
      distro: ${{ matrix.distro }}
      image_url: ${{ needs.module.outputs.image }}
      repo_ref: ${{ needs.module.outputs.sha }}
      version_tag: ${{ needs.module.outputs.tag }}
      # pihole is a DNS cache and a small PHP interface, the default is plenty.
      vm_mem: 6144
      debug_shell: ${{ github.event.inputs.debug_shell == 'true' || false }}
