name: "Test module on QEMU"

# Self-contained alternative to test-module.yml, which needs the Nethesis
# DigitalOcean infrastructure. The job itself lives in stephdl/ns8-ci-actions;
# everything it needs from this repository is build-images.sh, test-module.sh
# and tests/.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug_shell:
        description: "Open a tmate shell when the suite fails"
        required: false
        default: false
        type: boolean

# A new push rebuilds the module image from the new checkout, so a run started
# on the previous commit is testing code that no longer exists. This has to stay
# here: a reusable workflow cannot declare a concurrency group covering the
# calling run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky9, debian13]
    uses: stephdl/ns8-ci-actions/.github/workflows/test-on-qemu.yml@main
    with:
      distro: ${{ matrix.distro }}
      # pihole is a DNS cache and a small PHP interface, the default is plenty.
      vm_mem: 6144
      debug_shell: ${{ github.event.inputs.debug_shell == 'true' || false }}
